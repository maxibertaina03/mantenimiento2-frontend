# Integración continua: antes de que algo llegue a producción, se revisa, se
# compila y se corren todos los tests.
#
# Vercel despliega solo cuando main recibe un push. Con la protección de la
# rama main (el check «CI / frontend» requerido), un cambio que rompe los
# tests no se puede mergear a main.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo: hace falta para revisar los commits nuevos.
          fetch-depth: 0

      - name: Formato de los commits
        # Solo los commits nuevos (los del pull request, o los del push), con el
        # formato de CONTRIBUTING.md. El historial viejo no se revisa.
        env:
          DESDE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HASTA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$DESDE" ] || [ "$DESDE" = "0000000000000000000000000000000000000000" ]; then
            DESDE="$HASTA~1"
          fi
          node scripts/verificar-commits.mjs "$DESDE..$HASTA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código (lint)
        run: npx eslint . --ext ts,tsx

      - name: Tests
        run: npx vitest run

      - name: Compilar (tsc + vite build)
        run: npm run build
        env:
          # El build exige VITE_API_URL (vite.config.ts): sin ella publicaría un
          # sitio apuntando a localhost. Este build solo se compila, no se
          # publica, así que la dirección no apunta a ningún lado a propósito.
          VITE_API_URL: https://ci.invalid/api
