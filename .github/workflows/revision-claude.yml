# Revisión automática de cada PR hacia main, hecha por Claude.
#
# Lee el cambio y deja comentarios en el PR sobre los errores que encuentra (o
# uno solo diciendo que no encontró nada). No modifica código, no fusiona y no
# bloquea: el check obligatorio sigue siendo el CI. Es una segunda mirada.
#
# Usa el secreto CLAUDE_CODE_OAUTH_TOKEN (la suscripción de Claude, generado
# con `claude setup-token`). No tiene acceso a ninguna base de datos ni a
# producción: solo al código del PR.
name: Revisión de Claude

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: revision-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
